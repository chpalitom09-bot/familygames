<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#16221e;--pn:#1f2f29;--ln:#33473f;--tx:#ece6d6;--mu:#93a39a;--gd:#c2a15f;--iv:#f5f0e3;--rd:#a3312c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 0,#22352d,var(--bg));color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{height:100%}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.01em}
h1{font-size:46px;line-height:1.05}h2{font-size:26px}
button,input{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 16px;cursor:pointer}
button:hover{border-color:var(--gd)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
button.pri{background:var(--gd);color:#1a1810;border-color:var(--gd);font-weight:600}
button.link{background:none;border:0;color:var(--mu);text-decoration:underline}
button:disabled{opacity:.45;cursor:not-allowed}
input{background:#15211c;border:1px solid var(--ln);border-radius:8px;padding:10px 12px;width:100%}
label{display:block;color:var(--mu);margin-bottom:6px;font-size:13px}
.home,.lobby{max-width:420px;margin:0 auto;padding:9vh 20px 30px;display:flex;flex-direction:column;gap:18px}
.sub{color:var(--mu)}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px}.row input{text-transform:uppercase;letter-spacing:.2em;text-align:center}
.or{color:var(--mu);text-align:center;font-size:13px}
.err{color:#e0928c;min-height:20px}
.code{font:700 44px 'Cormorant Garamond',Georgia,serif;letter-spacing:.25em;color:var(--gd);text-align:center}
.plist{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;justify-content:space-between;padding:9px 12px;background:#15211c;border-radius:8px}
.plist small{color:var(--mu)}
.c{text-align:center;padding:40px;color:var(--mu)}
/* jeu */
.game{display:flex;flex-direction:column;height:100%;max-width:1000px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--mu);font-size:13px}
.top button{padding:6px 12px;font-size:13px}
.seats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 10px}
.seat{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;min-width:96px;text-align:center;transition:border-color .2s,box-shadow .2s}
.seat b{display:block;font-weight:600}.seat span{color:var(--mu);font-size:13px}
.seat.turn{border-color:var(--gd);box-shadow:0 0 0 1px var(--gd)}
.seat.done{opacity:.6}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;min-height:190px}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px}
.pile .card{animation:drop .25s ease-out}
.empty{width:66px;height:106px;border:1.5px dashed var(--ln);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px;text-align:center}
.msg{color:var(--mu);text-align:center;min-height:22px}
.turnbar{color:var(--gd);font-weight:600;text-align:center;min-height:22px}
.ctl{display:flex;gap:8px;justify-content:center;align-items:center;padding:6px;flex-wrap:wrap}
.ctl button{padding:8px 12px;font-size:13px}.ctl button.on{border-color:var(--gd);color:var(--gd)}
.hand{display:flex;overflow-x:auto;padding:22px 16px 14px;justify-content:safe center}
.hand .card{margin-left:-30px}.hand .card:first-child{margin-left:0}
/* cartes */
.card{--w:66px;width:var(--w);height:calc(var(--w)*1.6);border-radius:8px;position:relative;flex:none;background:var(--iv);color:#1d1f22;box-shadow:0 2px 6px #0007;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;user-select:none;transition:transform .15s,filter .15s}
.card i{position:absolute;left:6px;top:5px;font:700 14px/1.1 Georgia,serif;text-align:center}
.card i+i{left:auto;right:6px;top:auto;bottom:5px;transform:rotate(180deg)}
.card b{font-size:34px;line-height:1}.card small{font:600 8px Inter,sans-serif;letter-spacing:.08em;margin-top:4px}
.card.red{color:var(--rd)}
.card.at{background:linear-gradient(160deg,#243349,#182234);color:#dcc48c;border:1px solid var(--gd)}
.card.at b{font-size:36px}
.card.ex{background:#101512;color:var(--gd);border:1px solid var(--gd)}
.card.no{filter:brightness(.55)}.card.ok{cursor:pointer}
.card.ok:hover{transform:translateY(-14px)}
.fresh .card{animation:deal .4s 2.4s both}
@keyframes deal{from{transform:translateY(50px);opacity:0}}
@keyframes drop{from{transform:translateY(-24px) scale(1.08);opacity:0}}
@media(min-width:700px){.card{--w:86px}.card b{font-size:44px}.hand .card{margin-left:-24px}.empty{width:86px;height:138px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* overlays */
#anim,#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;background:#0d1512ee;gap:26px}
#anim .st{position:relative;width:70px;height:112px}
#anim i{position:absolute;inset:0;border-radius:8px;border:3px solid var(--iv);box-shadow:0 2px 6px #0008;background:repeating-linear-gradient(45deg,#2a4a41 0 6px,#1d382f 6px 12px)}
.sh i:nth-child(odd){animation:sa .35s ease-in-out 4 alternate}.sh i:nth-child(even){animation:sb .35s ease-in-out 4 alternate}
@keyframes sa{from{transform:translateX(-50px) rotate(-8deg)}to{transform:translateX(50px) rotate(8deg)}}
@keyframes sb{from{transform:translateX(50px) rotate(8deg)}to{transform:translateX(-50px) rotate(-8deg)}}
.dl i{animation:dl .55s ease-in forwards}
@keyframes dl{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
#modal{justify-content:flex-start;overflow:auto;padding:24px 16px;align-items:center;gap:14px}
#modal .box{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:22px;max-width:560px;width:100%}
.box h3{font:700 20px 'Cormorant Garamond',Georgia,serif;color:var(--gd);margin:14px 0 4px}
.box p,.box li{color:#d8d2c2;margin-bottom:4px}.box ul{padding-left:18px}
.res{position:fixed;inset:0;background:#0d1512ee;display:flex;align-items:center;justify-content:center;z-index:8;padding:16px}
.res .panel{width:100%;max-width:380px}
.res ol{padding-left:22px;display:flex;flex-direction:column;gap:6px}
</style></head>
<body>
<div id="app"></div>
<div id="anim"></div>
<div id="modal"><div class="box" id="rules"></div><button class="pri" id="mc">Fermer</button></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getDatabase,ref,onValue,update,set,get} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const db=getDatabase(initializeApp({
  apiKey:"AIzaSyDmdsmRQVFPFQugT-vbqz_qkqhThX190Ow",authDomain:"familygames-371bd.firebaseapp.com",
  databaseURL:"https://familygames-371bd-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"familygames-371bd",storageBucket:"familygames-371bd.firebasestorage.app",
  messagingSenderId:"1031229407251",appId:"1:1031229407251:web:bc5c8675ab987c8933bfe6"}));

/* ---------- règles du jeu (logique pure) ---------- */
const R=['3','4','5','6','7','8','9','10','V','C','D','R','A','2'],S=['♥','♠','♣','♦'];
// cartes : 0-55 normales (couleur=⌊c/14⌋, rang=c%14) · 56-76 atouts 1..21 · 77 excuse · dame de cœur = 10
const isT=c=>c>=56&&c<77;
const str=c=>c<56?c%14:(v=>v>=3?v-3:v+18)(c-55);
const canPlay=(c,t)=>!t||c===77||(isT(c)===isT(t.c)&&str(c)>str(t.c));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const $=s=>document.querySelector(s);

function card(c,cls=''){
  if(c===77)return `<div class="card ex ${cls}"><b>★</b><small>EXCUSE</small></div>`;
  if(isT(c)){const v=c-55;return `<div class="card at ${cls}" data-c="${c}"><i>${v}</i><b>${v}</b><i>${v}</i><small>ATOUT</small></div>`}
  const s=Math.floor(c/14),r=R[c%14],red=s===0||s===3?'red':'';
  return `<div class="card ${red} ${cls}" data-c="${c}"><i>${r}<br>${S[s]}</i><b>${S[s]}</b><i>${r}<br>${S[s]}</i></div>`;
}
const cardX=(c,cls)=>card(c,cls).replace('class="card ex','data-c="77" class="card ex');

/* ---------- état local ---------- */
let code,me,meta={},players={},st=null,hand=[],unsub=[],dir=1,fresh=false,lastDeal=0;
const store=JSON.parse(localStorage.getItem('fg')||'{}');
const app=$('#app'),nm=id=>players[id]?players[id].n:'?';
const rk=r=>r===0?'1er':(r+1)+'e';

function enter(){
  unsub.forEach(f=>f());const b='g/'+code+'/';
  unsub=[
    onValue(ref(db,b+'meta'),s=>{const o=s.val();if(!o){leave();return}
      const isNew=o.st==='play'&&o.deal!==lastDeal&&Date.now()-o.deal<10000;
      meta=o;if(o.st==='lobby'){st=null;hand=[]}
      if(isNew){lastDeal=o.deal;fresh=true;anim();setTimeout(()=>fresh=false,3200)}
      render()}),
    onValue(ref(db,b+'players'),s=>{players=s.val()||{};render()}),
    onValue(ref(db,b+'state'),s=>{st=s.val();render()}),
    onValue(ref(db,b+'hands/'+me),s=>{hand=Object.values(s.val()||{});render()})];
  localStorage.setItem('fg',JSON.stringify({code,me,name:store.name}));
  history.replaceState(null,'','#'+code);
}
function leave(){unsub.forEach(f=>f());unsub=[];code=me=null;meta={};st=null;hand=[];
  localStorage.setItem('fg',JSON.stringify({name:store.name}));history.replaceState(null,'','#');render()}

/* ---------- écrans ---------- */
function render(){
  if(!code)return home();
  if(!meta.st){app.innerHTML='<p class="c">Chargement…</p>';return}
  meta.st==='lobby'?lobby():game();
}
function home(){
  if(document.activeElement&&document.activeElement.id==='nm')return;
  app.innerHTML=`<main class="home"><div><h1>Family Games</h1><p class="sub">Les jeux de société de la famille, même à distance.</p></div>
  <div class="panel"><div><label for="nm">Ton pseudo</label><input id="nm" maxlength="14" value="${esc(store.name||'')}" autocomplete="off"></div>
  <button class="pri" data-a="create">Créer une partie</button>
  <div class="or">ou rejoindre avec un code</div>
  <div class="row"><input id="cd" maxlength="4" placeholder="CODE" value="${esc(location.hash.slice(1).toUpperCase())}"><button data-a="join">Rejoindre</button></div>
  <p class="err" id="err"></p></div>
  <button class="link" data-a="rules">Règles du jeu</button></main>`;
}
function lobby(){
  const ids=Object.keys(players).sort((a,b)=>players[a].t-players[b].t),n=ids.length,host=meta.host===me;
  app.innerHTML=`<main class="lobby"><h2>Salle d'attente</h2>
  <div class="panel"><label>Code à partager</label><div class="code">${code}</div>
  <ul class="plist">${ids.map(i=>`<li><span>${esc(players[i].n)}${i===me?' (toi)':''}</span><small>${i===meta.host?'hôte':''}</small></li>`).join('')}</ul>
  <p class="sub">${n} joueur${n>1?'s':''} · de 2 à 8 · ${Math.floor(78/n)} cartes chacun</p>
  ${host?`<button class="pri" data-a="start" ${n<2?'disabled':''}>Lancer la partie</button>`:'<p class="sub">En attente de l\'hôte…</p>'}
  </div><div class="row" style="justify-content:space-between"><button class="link" data-a="rules">Règles du jeu</button><button class="link" data-a="leave">Quitter</button></div></main>`;
}
function sorted(){
  const g=c=>c===77?2:isT(c)?1:0;
  return [...hand].sort((a,b)=>g(a)-g(b)||dir*(str(a)-str(b)||a-b));
}
function game(){
  if(!st){app.innerHTML='<p class="c">Chargement…</p>';return}
  const o=st.o,fin=st.fin||[],ps=st.ps||{},cnt=st.cnt||{},over=meta.st==='over',my=st.turn===me&&!over,tb=st.tb;
  const i=o.indexOf(me),oth=[];for(let k=1;k<o.length;k++)oth.push(o[(i+k)%o.length]);
  const seat=id=>{const r=fin.indexOf(id);return `<div class="seat ${st.turn===id&&!over?'turn':''} ${r>=0?'done':''}"><b>${esc(nm(id))}</b><span>${r>=0?rk(r):ps[id]?'passe':cnt[id]+' cartes'}</span></div>`};
  const can=my&&!ps[me]&&!fin.includes(me);
  const h=sorted(),some=can&&h.some(c=>canPlay(c,tb));
  let bar=over?'Partie terminée':fin.includes(me)?`Tu as fini ${rk(fin.indexOf(me))} !`:my?(tb?(some?'À toi de jouer':'Aucune carte jouable : passe ton tour'):'À toi d\'ouvrir le pli'):ps[me]?'Tu as passé, en attente du pli…':`Au tour de ${esc(nm(st.turn))}`;
  app.innerHTML=`<div class="game"><div class="top"><span>Partie ${code}</span><button data-a="rules">Règles</button></div>
  <div class="seats">${oth.map(seat).join('')}</div>
  <div class="mid"><div class="pile">${tb?card(tb.c)+`<span class="msg">${esc(nm(tb.p))}</span>`:'<div class="empty">Table<br>vide</div>'}</div>
  <p class="msg">${esc(st.msg||'')}</p><p class="turnbar">${bar}</p></div>
  <div class="ctl"><button data-a="asc" class="${dir>0?'on':''}">Tri croissant</button><button data-a="desc" class="${dir<0?'on':''}">Tri décroissant</button>
  ${can&&tb?`<button class="pri" data-a="pass">Passer</button>`:''}</div>
  <div class="hand ${fresh?'fresh':''}">${h.map(c=>card(c,can&&canPlay(c,tb)?'ok':'no')).join('')}</div></div>
  ${over?`<div class="res"><div class="panel"><h2>Classement</h2><ol>${fin.map((id,k)=>`<li>${esc(nm(id))}${k===fin.length-1?' — a perdu':''}</li>`).join('')}</ol>
  ${meta.host===me?'<button class="pri" data-a="again">Rejouer</button>':'<p class="sub">L\'hôte peut relancer une partie.</p>'}<button data-a="leave">Quitter</button></div></div>`:''}`;
}

/* ---------- actions ---------- */
const uid=()=>Math.random().toString(36).slice(2,10);
const gen=()=>Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.random()*23|0]).join('');
const err=t=>{const e=$('#err');if(e)e.textContent=t};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function start(){
  const ids=Object.keys(players).sort((a,b)=>players[a].t-players[b].t),n=ids.length,d=shuffle([...Array(78).keys()]);
  const per=Math.floor(78/n),H={};ids.forEach(i=>H[i]=[]);
  let k=0,size=3;
  while(H[ids[n-1]].length<per){for(const i of ids){const m=Math.min(size,per-H[i].length);for(let j=0;j<m;j++)H[i].push(d[k++])}size=size===3?2:3}
  const turn=ids.find(i=>H[i].includes(10))||ids[Math.random()*n|0],cnt={};ids.forEach(i=>cnt[i]=per);
  update(ref(db,'g/'+code),{hands:H,
    state:{o:ids,turn,tb:null,ps:{},fin:[],cnt,seq:1,msg:`${players[turn].n} commence`},
    'meta/st':'play','meta/deal':Date.now()});
}
// c = carte jouée, ou null pour passer. Une seule écriture groupée par action.
function act(c){
  if(!st||st.turn!==me)return;
  const o=st.o,fin=[...(st.fin||[])],ps={...(st.ps||{})},cnt={...st.cnt};let tb=st.tb,hnd=null,msg;
  if(c!==null){hnd=hand.filter(x=>x!==c);cnt[me]=hnd.length;if(!hnd.length)fin.push(me);tb={p:me,c};
    msg=`${nm(me)} joue`+(c===77?' l\'Excuse':'')+(hnd.length?'':' et a fini !')}
  else{ps[me]=true;msg=`${nm(me)} passe`}
  const left=o.filter(x=>!fin.includes(x)),over=left.length<=1;if(over&&left[0])fin.push(left[0]);
  let turn=null;
  if(!over){
    const idx=o.indexOf(me);let end=c===77;
    if(!end){end=true;for(let k=1;k<o.length;k++){const q=o[(idx+k)%o.length];if(q===tb.p)break;if(fin.includes(q)||ps[q])continue;turn=q;end=false;break}}
    if(end){let w=tb.p;const wi=o.indexOf(w);
      if(fin.includes(w))for(let k=1;k<o.length;k++){const q=o[(wi+k)%o.length];if(!fin.includes(q)){w=q;break}}
      turn=w;msg+=` · ${nm(tb.p)} remporte le pli`;tb=null;msg+=''}
  }
  const u={state:{o,turn,tb,ps:turn===null||!tb?{}:ps,fin,cnt,seq:(st.seq||0)+1,msg}};
  if(hnd)u['hands/'+me]=hnd;if(over)u['meta/st']='over';
  update(ref(db,'g/'+code),u);
}
function anim(){
  const a=$('#anim');a.innerHTML='<div class="st sh">'+'<i></i>'.repeat(9)+'</div><p>Mélange…</p>';a.style.display='flex';
  setTimeout(()=>{const s=a.querySelector('.st');s.className='st dl';
    s.querySelectorAll('i').forEach((e,k)=>{const g=k/9*6.28;e.style.cssText=`--x:${Math.cos(g)*190|0}px;--y:${Math.sin(g)*190|0}px;--r:${k*40}deg;animation-delay:${k*.05}s`});
    a.querySelector('p').textContent='Distribution…'},1500);
  setTimeout(()=>a.style.display='none',2500);
}
function showRules(){
  $('#rules').innerHTML=`<h2>Règles du jeu</h2>
  <h3>But</h3><p>Se débarrasser de toutes ses cartes. Le premier à finir gagne, puis le deuxième, etc. Le dernier qui garde des cartes perd.</p>
  <h3>Les cartes (jeu de tarot, 78 cartes)</h3><ul>
  <li><b>Normales</b> (cœur, pique, trèfle, carreau) : 3, 4, 5, 6, 7, 8, 9, 10, Valet, Cavalier, Dame, Roi, As, 2. La couleur n'a aucune importance.</li>
  <li><b>Atouts</b> de 1 à 21.</li><li><b>L'Excuse</b>, la carte spéciale.</li></ul>
  <h3>Force des cartes</h3><ul><li>Normales, de la plus faible à la plus forte : 3 &lt; 4 &lt; … &lt; 10 &lt; V &lt; C &lt; D &lt; R &lt; As &lt; 2.</li>
  <li>Atouts : 3 &lt; 4 &lt; … &lt; 21 &lt; 1 &lt; 2. Le 21 est battu par l'1, lui-même battu par le 2.</li>
  <li>Excuse : elle bat tout, mais pour un seul pli.</li></ul>
  <h3>Distribution</h3><p>Les cartes sont mélangées puis distribuées par paquets de 3 puis de 2, chacun reçoit le même nombre de cartes. Les cartes en trop ne sont pas utilisées, de 2 à 8 joueurs.</p>
  <h3>Un pli</h3><ul><li>Le joueur qui a la Dame de cœur commence (sinon, tirage au sort) et pose une carte.</li>
  <li>Les suivants jouent, dans l'ordre, une carte <b>plus forte</b> du <b>même type</b> : normale sur normale, atout sur atout.</li>
  <li>On n'est jamais obligé de jouer : on peut passer, mais on ne joue plus jusqu'à la fin du pli.</li>
  <li>Quand tous les autres ont passé, le dernier à avoir joué remporte le pli et ouvre le suivant.</li>
  <li>L'Excuse se joue à tout moment : elle remporte aussitôt le pli, et son joueur rejoue.</li></ul>
  <p style="margin-top:10px">Le jeu grise les cartes que tu ne peux pas jouer.</p>`;
  $('#modal').style.display='flex';
}
$('#mc').onclick=()=>$('#modal').style.display='none';

app.onclick=async e=>{
  const cd=e.target.closest('.hand .card.ok');if(cd){act(+cd.dataset.c);return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='rules')showRules();
  else if(a==='asc'){dir=1;render()}else if(a==='desc'){dir=-1;render()}
  else if(a==='pass')act(null);
  else if(a==='start')start();
  else if(a==='leave')leave();
  else if(a==='again')update(ref(db,'g/'+code),{state:null,hands:null,'meta/st':'lobby'});
  else if(a==='create'||a==='join'){
    const name=$('#nm').value.trim();if(!name)return err('Choisis un pseudo.');
    store.name=name;
    try{
      if(a==='create'){let c;do{c=gen()}while((await get(ref(db,'g/'+c+'/meta'))).exists());
        me=uid();await set(ref(db,'g/'+c),{meta:{host:me,st:'lobby',game:'atouts'},players:{[me]:{n:name,t:Date.now()}}});code=c}
      else{const c=$('#cd').value.trim().toUpperCase();
        const m=(await get(ref(db,'g/'+c+'/meta'))).val();
        if(!m)return err('Aucune partie avec ce code.');if(m.st!=='lobby')return err('Cette partie a déjà commencé.');
        const p=(await get(ref(db,'g/'+c+'/players'))).val()||{};if(Object.keys(p).length>=8)return err('La partie est complète (8 joueurs).');
        me=uid();await set(ref(db,`g/${c}/players/${me}`),{n:name,t:Date.now()});code=c}
      enter();
    }catch(x){err('Connexion impossible. Réessaie.')}
  }
};
// reprise automatique après un rechargement de page
(async()=>{
  if(store.code&&store.me){
    try{const s=await get(ref(db,`g/${store.code}/players/${store.me}`));
      if(s.exists()){code=store.code;me=store.me;enter();return}}catch(x){}
  }
  render();
})();
</script>
