function card(c,cls=''){

  if(c===77)return `<div class="card ex ${cls}" data-c="77"><span class="nu">★</span>${A(0,ART[77])}<span class="na">Le Mat</span></div>`;
  if(isT(c)){const v=c-55;return `<div class="card at ${cls}" data-c="${c}"><span class="nu">${v}</span>${A(0,ART[v])}<span class="na">${NAME[v]}</span></div>`}
  const s=Math.floor(c/14),ri=c%14,r=R[ri],red=s===0||s===3?'red':'';

function start(){
  const ids=Object.keys(players).filter(i=>!players[i].x).sort((a,b)=>players[a].t-players[b].t),n=ids.length,d=shuffle([...Array(78).keys()]);
  const per=Math.floor(78/n),H={};ids.forEach(i=>H[i]=[]);
  let k=0,size=3;
  while(H[ids[n-1]].length<per){for(const i of ids){const m=Math.min(size,per-H[i].length);for(let j=0;j<m;j++)H[i].push(d[k++])}size=size===3?2:3}
  const turn=ids.find(i=>H[i].includes(10))||ids[Math.random()*n|0],cnt={};ids.forEach(i=>cnt[i]=per);
  update(ref(db,'g/'+code),{hands:H,
    state:{o:ids,turn,tb:null,ps:{},fin:[],cnt,seq:1,msg:`${players[turn].n} commence`},
    'meta/st':'play','meta/deal':Date.now()});
}
// cs = cartes jouées (tableau), ou null pour passer. Une seule écriture groupée par action.
function act(cs){
  if(!st||st.turn!==me)return;
  if(cs&&!valid(cs,st.tb))return;
  const o=st.o,fin=[...(st.fin||[])],ps={...(st.ps||{})},cnt={...st.cnt};let tb=st.tb,hnd=null,msg,lp=null;
  const ex=!!(cs&&cs[0]===77);
  if(cs){hnd=hand.filter(x=>!cs.includes(x));cnt[me]=hnd.length;if(!hnd.length)fin.push(me);
    tb=ex?{p:me,cs:[77]}:{p:me,cs,t:isT(cs[0])?1:0,s:Math.max(...cs.map(str))};if(ex)lp={p:me};
    msg=`${nm(me)} joue `+(ex?'l\'Excuse':cs.length>1?cs.length+' cartes':'une carte')+(hnd.length?'':' et a fini !')}
  else{ps[me]=true;msg=`${nm(me)} passe`}
  const left=o.filter(x=>!fin.includes(x)),over=left.length<=1;if(over&&left[0])fin.push(left[0]);
  let turn=null;
  if(!over){
    const idx=o.indexOf(me);let end=ex;
    if(!end){end=true;for(let k=1;k<o.length;k++){const q=o[(idx+k)%o.length];if(q===tb.p)break;if(fin.includes(q)||ps[q])continue;turn=q;end=false;break}}
    if(end){let w=tb.p;const wi=o.indexOf(w);
      if(fin.includes(w))for(let k=1;k<o.length;k++){const q=o[(wi+k)%o.length];if(!fin.includes(q)){w=q;break}}
      turn=w;msg+=` · ${nm(tb.p)} remporte le pli`;tb=null}
  }
  const u={state:{o,turn,tb,ps:turn===null||!tb?{}:ps,fin,cnt,seq:(st.seq||0)+1,msg,lp,out:st.out||null}};
  if(hnd)u['hands/'+me]=hnd;if(over)u['meta/st']='over';
  update(ref(db,'g/'+code),u);
}

function dealAnim(){
  const a=$('#anim');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){a.style.display='none';return}
  const o=st.o,n=o.length,per=Math.floor(78/n),first=st.msg||'',T=(f,d)=>tms.push(setTimeout(f,d));
  const pos=k=>{const g=Math.PI/2+((k-o.indexOf(me)+n)%n)*2*Math.PI/n;return [50+42*Math.cos(g),50+38*Math.sin(g)]};
  a.innerHTML=`<p class="at">Mélange…</p><div class="tbl">${o.map((id,k)=>{const [x,y]=pos(k);
    return `<div class="ds" data-id="${id}" style="left:${x}%;top:${y}%"><span class="av">${esc(nm(id).slice(0,1).toUpperCase())}</span><b>${esc(nm(id))}${id===me?' (toi)':''}</b><em>0</em></div>`}).join('')}
    <div class="deck sh">${Array.from({length:8},(_,k)=>`<i style="transform:translate(${k*.5}px,${-k*.8}px)"></i>`).join('')}</div></div><button class="link" id="sk">Passer l'animation</button>`;
  a.style.display='flex';a.style.opacity=1;$('#sk').onclick=endAnim;
  const got={},seq=[];o.forEach(id=>got[id]=0);let sz=3;
  while(got[o[n-1]]<per){for(const id of o){const m=Math.min(sz,per-got[id]);if(m>0){seq.push([id,m]);got[id]+=m}}sz=sz===3?2:3}
  const STEP=170,t0=1500;
  T(()=>{$('.at').textContent='Distribution…';$('.deck').classList.remove('sh')},t0-100);
  seq.forEach(([id,m],k)=>T(()=>fly(id,m),t0+k*STEP));
  const tend=t0+seq.length*STEP+700;
  T(()=>{$('.deck').style.opacity=0;$('.at').textContent=first},tend);
  T(endAnim,tend+1400);
}
function askQuit(){
  const p=meta.st==='play'?['Abandonner la partie ?','Tu quittes la partie en cours : les autres pourront continuer sans toi.']:
    meta.st==='over'?['Quitter la partie ?','La partie est terminée, tu reviens à l\'accueil.']:['Quitter la salle ?','Tu reviens à l\'accueil.'];
  $('#cft').textContent=p[0];$('#cfp').textContent=p[1];$('#cf').style.display='flex';
}
$('#cf').onclick=e=>{const k=e.target.dataset.k;if(e.target.id==='cf'||k==='no')$('#cf').style.display='none';if(k==='yes'){$('#cf').style.display='none';quit()}};
async function quit(){
  const root='g/'+code,ids=Object.keys(players).filter(i=>i!==me&&!players[i].x).sort((a,b)=>players[a].t-players[b].t);
  try{
    if(!ids.length)await set(ref(db,root),null); // dernier joueur : on supprime la partie
    else{
      const u={};if(meta.host===me)u['meta/host']=ids[0];
      if(meta.st==='lobby')u['players/'+me]=null;
      else{u['players/'+me+'/x']=1;
        if(meta.st==='play'&&st&&!(st.fin||[]).includes(me)){
          const o=st.o,n=o.length,fin=[...(st.fin||[]),me],ps={...(st.ps||{})},out={...(st.out||{}),[me]:1};
          const left=o.filter(x=>!fin.includes(x)),over=left.length<=1;if(over&&left[0])fin.push(left[0]);
          let turn=st.turn,tb=st.tb;
          if(!over&&turn===me){turn=null;
            if(tb)for(let k=1;k<n;k++){const q=o[(o.indexOf(me)+k)%n];if(q===tb.p)break;if(fin.includes(q)||ps[q])continue;turn=q;break}
            if(turn===null){let w=tb?tb.p:me;if(fin.includes(w))for(let k=1;k<n;k++){const q=o[(o.indexOf(w)+k)%n];if(!fin.includes(q)){w=q;break}}turn=w;tb=null}}
          u.state={...st,fin,out,tb,ps:tb?ps:{},turn:over?null:turn,seq:(st.seq||0)+1,msg:nm(me)+' a quitté la partie',lp:null};
          u['hands/'+me]=null;if(over)u['meta/st']='over';
        }}
      await update(ref(db,root),u);
    }
  }catch(x){}
  leave();
}
function showRules(){
  $('#rules').innerHTML=`<h2>Règles du jeu</h2>
  <h3>But</h3><p>Se débarrasser de toutes ses cartes. Le premier à finir gagne, puis le deuxième, etc. Le dernier qui garde des cartes perd.</p>
  <h3>Les cartes (jeu de tarot, 78 cartes)</h3><ul>
  <li><b>Normales</b> (cœur, pique, trèfle, carreau) : 3, 4, 5, 6, 7, 8, 9, 10, Valet, Cavalier, Dame, Roi, As, 2. La couleur n'a aucune importance.</li>
  <li><b>Atouts</b> de 1 à 21.</li><li><b>L'Excuse</b>, la carte spéciale.</li></ul>
  <h3>Force des cartes</h3><ul><li>Normales, de la plus faible à la plus forte : 3 &lt; 4 &lt; … &lt; 10 &lt; V &lt; C &lt; D &lt; R &lt; As &lt; 2.</li>
  <li>Atouts : 3 &lt; 4 &lt; … &lt; 21 &lt; 1 &lt; 2. Le 21 est battu par l'1, lui-même battu par le 2.</li>
  <li>Excuse : elle bat tout, mais pour un seul pli.</li></ul>
  <h3>Distribution</h3><p>Les cartes sont mélangées puis distribuées par paquets de 3 puis de 2, chacun reçoit le même nombre de cartes. Les cartes en trop ne sont pas utilisées, de 2 à 8 joueurs.</p>
  <h3>Un pli</h3><ul><li>Le joueur qui a la Dame de cœur commence (sinon, tirage au sort) et pose une carte.</li>
  <li>Tu peux jouer <b>plusieurs cartes à la fois</b> : des normales de même valeur (2, 3 ou 4 cartes identiques), ou une <b>suite d'atouts</b> (par exemple 5-6-7). Sélectionne tes cartes puis appuie sur « Jouer ».</li><li>Les suivants doivent jouer <b>autant de cartes</b>, du <b>même type</b> et de valeur plus forte : normales identiques sur normales identiques, suite d'atouts sur une suite d'atouts plus haute de même longueur.</li>
  <li>On n'est jamais obligé de jouer : on peut passer, mais on ne joue plus jusqu'à la fin du pli.</li>
  <li>Quand tous les autres ont passé, le dernier à avoir joué remporte le pli et ouvre le suivant.</li>
  <li>L'Excuse se joue à tout moment : elle remporte aussitôt le pli, et son joueur rejoue. Elle se joue toujours seule.</li></ul>
  <p style="margin-top:10px">Le jeu grise les cartes que tu ne peux pas jouer.</p>`;
  $('#modal').style.display='flex';
}
$('#mc').onclick=()=>$('#modal').style.display='none';

app.onclick=async e=>{
  const cd=e.target.closest('.hand .card.ok');if(cd){const c=+cd.dataset.c,n=st.tb?st.tb.cs.length:0;
    if(sel.includes(c))sel=sel.filter(x=>x!==c);
    else if(sel.length&&(!n||sel.length<n)&&sel.every(a=>compat(a,c)))sel=[...sel,c];
    else sel=[c];
    render();return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='rules')showRules();
  else if(a==='asc'){dir=1;render()}else if(a==='desc'){dir=-1;render()}
  else if(a==='pass')act(null);
  else if(a==='play'){const cs=[...sel];sel=[];act(cs)}
  else if(a==='start')start();
  else if(a==='askquit')askQuit();
  else if(a==='again'){const u={state:null,hands:null,'meta/st':'lobby'};for(const id in players)if(players[id].x)u['players/'+id]=null;update(ref(db,'g/'+code),u)}
  else if(a==='theme'){const n=document.documentElement.dataset.t==='dark'?'light':'dark';document.documentElement.dataset.t=n;localStorage.setItem('fgt',n)}
  else if(a==='tab-login'||a==='tab-signup'){const v=($('#em')||{}).value||'';amode=a==='tab-login'?'login':'signup';authScreen();$('#em').value=v}
  else if(a==='google'){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){authErr(x)}}
  else if(a==='submit'){const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw)return authErr('Remplis tous les champs.');
    try{if(amode==='login')await signInWithEmailAndPassword(auth,em,pw);
      else{if(pw!==$('#pw2').value)return authErr('Les mots de passe ne correspondent pas.');await createUserWithEmailAndPassword(auth,em,pw)}}catch(x){authErr(x)}}
  else if(a==='forgot'){const em=$('#em').value.trim();if(!em)return authErr('Saisis ton email ci-dessus.');
    try{await sendPasswordResetEmail(auth,em);authErr('Email de réinitialisation envoyé.')}catch(x){authErr(x)}}
  else if(a==='signout'){await signOut(auth)}
  else if(a==='setname'){const v=$('#pn').value.trim();if(!/^[A-Za-z0-9_-]{3,14}$/.test(v))return err('3 à 14 caractères : lettres, chiffres, _ ou -.');
    const k=v.toLowerCase();
    try{const ex=(await get(ref(db,'names/'+k))).val();if(ex&&ex!==user.uid)return err('Ce pseudo est déjà pris.');
      if(!ex)await set(ref(db,'names/'+k),user.uid);
      await set(ref(db,'users/'+user.uid),{n:v,t:Date.now()});prof={n:v};startSocial();render()}catch(x){err('Pseudo indisponible, réessaie.')}}
  else if(a==='create'){try{let c;do{c=gen()}while((await get(ref(db,'g/'+c+'/meta'))).exists());
      me=user.uid;await set(ref(db,'g/'+c),{meta:{host:me,st:'lobby',game:'atouts'},players:{[me]:{n:prof.n,t:Date.now()}}});code=c;enter()}catch(x){err('Création impossible. Réessaie.')}}
  else if(a==='join')joinCode($('#cd').value.trim().toUpperCase());
  else if(a==='joinf')joinCode(t.dataset.c);
  else if(a==='addfriend')addFriend();
  else if(a==='accept')acceptFriend(t.dataset.id);
  else if(a==='decline')set(ref(db,`friendReq/${user.uid}/${t.dataset.id}`),null);
  else if(a==='rmfriend'){const id=t.dataset.id;if(confirm('Retirer '+friends[id].n+' de tes amis ?'))update(ref(db),{[`friends/${user.uid}/${id}`]:null,[`friends/${id}/${user.uid}`]:null})}
};
app.onkeydown=e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
  const m={em:'submit',pw:'submit',pw2:'submit',pn:'setname',cd:'join',fn:'addfriend'}[e.target.id];if(m)app.querySelector(`[data-a="${m}"]`).click()};
async function joinCode(c){
  if(!c)return err('Saisis un code.');
  try{const m=(await get(ref(db,'g/'+c+'/meta'))).val();if(!m)return err('Aucune partie avec ce code.');
    const p=(await get(ref(db,'g/'+c+'/players'))).val()||{};
    if(p[user.uid]&&!p[user.uid].x){me=user.uid;code=c;return enter()}
    if(m.st!=='lobby')return err('Cette partie a déjà commencé.');
    if(Object.values(p).filter(x=>!x.x).length>=8)return err('La partie est complète (8 joueurs).');
    me=user.uid;await set(ref(db,`g/${c}/players/${me}`),{n:prof.n,t:Date.now()});code=c;enter();
  }catch(x){err('Connexion impossible. Réessaie.')}
}
async function addFriend(){
  const v=($('#fn').value||'').trim().toLowerCase(),say=s=>$('#fm').textContent=s;
  if(!/^[a-z0-9_-]{3,14}$/.test(v))return say('Pseudo invalide.');
  if(v===prof.n.toLowerCase())return say('C\'est toi !');
  try{const id=(await get(ref(db,'names/'+v))).val();if(!id)return say('Aucun joueur avec ce pseudo.');
    if(friends[id])return say('Déjà dans tes amis.');
    if(reqs[id])return acceptFriend(id);
    await set(ref(db,`friendReq/${id}/${user.uid}`),{n:prof.n,t:Date.now()});say('Demande envoyée.');$('#fn').value='';
  }catch(x){say('Impossible d\'envoyer la demande.')}
}
function acceptFriend(id){const r=reqs[id];if(!r)return;
  update(ref(db),{[`friends/${user.uid}/${id}`]:{n:r.n},[`friends/${id}/${user.uid}`]:{n:prof.n},[`friendReq/${user.uid}/${id}`]:null}).catch(()=>{})}
function stopSocial(){fUns.forEach(f=>f());Object.values(liveUns).forEach(f=>f());fUns=[];liveUns={};friends={};reqs={};lives={}}
function syncLives(){
  for(const id in liveUns)if(!friends[id]){liveUns[id]();delete liveUns[id];delete lives[id]}
  for(const id in friends)if(!liveUns[id])liveUns[id]=onValue(ref(db,'live/'+id),s=>{lives[id]=s.val();if(!code)render()},()=>{});
}
function startSocial(){
  fUns=[onValue(ref(db,'friends/'+user.uid),s=>{friends=s.val()||{};syncLives();if(!code)render()}),
        onValue(ref(db,'friendReq/'+user.uid),s=>{reqs=s.val()||{};if(!code)render()})];
}
const AM={'auth/invalid-credential':'Email ou mot de passe incorrect.','auth/invalid-email':'Adresse email invalide.','auth/email-already-in-use':'Cet email est déjà utilisé.','auth/weak-password':'Mot de passe trop court (6 caractères minimum).','auth/too-many-requests':'Trop de tentatives, réessaie plus tard.','auth/network-request-failed':'Problème de connexion.'};
const authErr=x=>{if(x&&x.code==='auth/popup-closed-by-user')return;err(typeof x==='string'?x:(AM[x.code]||'Erreur de connexion ('+(x.code||'?')+').'))};
onAuthStateChanged(auth,async u=>{
  stopSocial();user=u;prof=null;ready=false;
  if(!u){if(code){unsub.forEach(f=>f());unsub=[];code=me=null;meta={};st=null;hand=[]}ready=true;render();return}
  try{prof=(await get(ref(db,'users/'+u.uid))).val()}catch(x){}
  if(prof&&prof.n){startSocial();
    const s=JSON.parse(localStorage.getItem('fg')||'{}');
    if(s.code&&s.u===u.uid){try{const p=(await get(ref(db,`g/${s.code}/players/${u.uid}`))).val();if(p&&!p.x){code=s.code;me=u.uid;ready=true;enter();return}}catch(x){}}}
  ready=true;render();
});
</script>
