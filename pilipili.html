function P(){if(!built||!S)return;const me_=me(),n=S.o.length,myT=S.ph==='play'&&S.t===me_,blind=S.m==='see'||(S.m==='blind'&&S.ph==='bet');

  S.o.forEach((_,i)=>{const s=$('#s'+i),b=A(S.bt,i),e=s.querySelector('em');s.classList.toggle('turn',S.ph==='play'&&S.t===i);
    let t=S.ph==='bet'?(b!=null?(S.m==='pub'?'pari '+b:'✓ prêt'):'…'):`${N(S.w,i)} / ${b}`;
    if(e.dataset.t!==t){const rv=ph0==='bet'&&S.ph==='play';e.dataset.t=t;e.textContent=t;e.className=rv?'rv':(S.ph!=='bet'?'bump':'');if(rv)e.style.animationDelay=i*.12+'s'}
    s.querySelector('i').innerHTML=chl(N(S.p,i));
    const oh=s.querySelector('.oh'),hh=(S.m==='see'||S.m==='open')&&i!==me_?hv(i).map(chip).join(''):'';if(oh.dataset.h!==hh){oh.dataset.h=hh;oh.innerHTML=hh}});
  ph0=S.ph;
  const hd=$('#hd');hd.classList.toggle('my',myT);
  const have=new Set(hand);[...hd.children].forEach(el=>{if(!have.has(+el.dataset.v))el.remove()});
  hand.forEach(v=>{if(hd.querySelector(`[data-v="${v}"]`))return;const t=document.createElement('div');t.innerHTML=card(v);const el=t.firstChild;
    el.style.animationDelay=Math.random()*.25+'s';const nx=blind?null:[...hd.children].find(x=>+x.dataset.v>v);hd.insertBefore(el,nx||null)});
  if(hb0&&!blind)[...hd.children].sort((a,b)=>a.dataset.v-b.dataset.v).forEach(el=>hd.appendChild(el));hb0=blind;
  [...hd.children].forEach(el=>el.classList.toggle('bk',blind));
  $('#ht').textContent=S.ph==='play'?(myT?'À toi de jouer':`Au tour de ${nm(S.t)}`):'';
  betUI();pile();score()}
function betUI(){const bp=$('#bp'),mine=A(S.bt,me())!=null;
  if(S.ph!=='bet'){bp.className='bp';bk0=0;return}
  bp.classList.add('on');
  if(mine){bp.classList.remove('oh');if(bk0!==-S.k){bk0=-S.k;const w=S.o.filter((_,i)=>A(S.bt,i)==null).map((_,i)=>0).length;bp.innerHTML=`<div class="glow" style="--ht:.5"></div><div class="stamp" style="position:relative;text-align:center"><svg class="ch" style="font-size:80px"><use href="#ch"/></svg><h2>Pari posé</h2></div><small style="margin-top:6px">En attente des autres… (${w} restant${w>1?'s':''})</small>`}
    else bp.querySelector('small').textContent=`En attente des autres… (${S.o.filter((_,i)=>A(S.bt,i)==null).length} restant(s))`;return}
  if(bk0===S.k){oth();return}bk0=S.k;const lo=S.m==='nz'?1:0,hi=S.h,W=72;let cur=-1;const strip=S.m==='see'||S.m==='open'||S.m==='pub';
  bp.classList.toggle('oh',strip);bp.style.setProperty('--r',Math.ceil((S.o.length-1)/2));
  bp.innerHTML=`${strip?'<div class="oth" id="oth"></div>':''}<div class="glow" id="gl"></div><div class="pp" id="pp"><svg class="ch chl"><use href="#ch"/></svg></div><div id="bn"></div><small>plis à remporter</small>
  <div id="dl">${Array.from({length:hi-lo+1},(_,i)=>`<button data-n="${lo+i}">${lo+i}</button>`).join('')}</div><button class="pri hot" id="bk">Je parie</button>`;
  const dl=$('#dl'),upd=()=>{const idx=Math.max(0,Math.min(hi-lo,Math.round(dl.scrollLeft/W))),v=lo+idx,ht=(v-lo)/((hi-lo)||1);
    [...dl.children].forEach((b,i)=>{const d=Math.abs(dl.scrollLeft/W-i);b.style.transform=`scale(${1.3-Math.min(d*.3,.6)})`;b.style.opacity=1-Math.min(d*.28,.65)});
    if(v!==cur){const up=v>cur;cur=v;navigator.vibrate&&navigator.vibrate(6);const bn=$('#bn');bn.innerHTML=`<span>${v}</span>`;bn.firstChild.style.animationDirection='normal';
      for(const id of ['gl','pp']){const e=$('#'+id);e&&e.style.setProperty('--ht',ht)}bp.style.setProperty('--ht',ht);
      $('#gl').style.setProperty('--ht',ht);$('#pp').style.setProperty('--ht',ht);
      $('#pp').querySelectorAll('.sk').forEach(x=>x.remove());for(let i=0;i<3+Math.round(ht*14);i++){const s=document.createElement('i');s.className='sk';s.style.setProperty('--x',20+Math.random()*60+'%');s.style.setProperty('--d',(1.6-ht*.9+Math.random()*.6)+'s');s.style.animationDelay=Math.random()*1.5+'s';$('#pp').appendChild(s)}}};
  let q=0;dl.onscroll=()=>{cancelAnimationFrame(q);q=requestAnimationFrame(upd)};
  dl.onclick=e=>{const b=e.target.closest('button');if(b)dl.scrollTo({left:(+b.dataset.n-lo)*W,behavior:'smooth'})};
  dl.scrollLeft=(Math.min(hi,Math.max(lo,1))-lo)*W;upd();
  oth();$('#bk').onclick=()=>update(DB('state'),{['bt/'+me()]:lo+Math.max(0,Math.min(hi-lo,Math.round(dl.scrollLeft/W)))})}
function oth(){const el=$('#oth');if(!el)return;const me_=me();
  const h=S.o.map((_,i)=>i).filter(i=>i!==me_).map(i=>{let c;if(S.m==='pub'){const b=A(S.bt,i);c=b!=null?`<b class="bt">${b}</b>`:'<span class="sub">…</span>'}else c=hv(i).map(chip).join('');
    return `<div class="or"><span class="nm">${esc(nm(i))}</span>${c}</div>`}).join('');
  if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=h}}
function pile(){const pl_=$('#pl'),tr=(k,s,v)=>{if(pl_.querySelector(`[data-k="${k}-${s}"]`))return;const [a,b]=sp(s),[c,d]=pp(s),t=document.createElement('div');
    t.className='pc';t.dataset.k=k+'-'+s;t.dataset.tr=k;t.style.cssText=`--l0:${a}%;--t0:${b}%;--l1:${c}%;--t1:${d}%;--r:${(Math.random()*24-12)|0}deg`;t.innerHTML=card(v);pl_.appendChild(t)};
  Object.entries(S.tb||{}).forEach(([s,v])=>tr(S.tc,s,v));
  if(S.lt&&S.lt.n>sw){sw=S.lt.n;const idx=S.lt.n%100-1,w=S.lt.w;Object.entries(S.lt.c).forEach(([s,v])=>tr(idx,s,v));
    setTimeout(()=>{const [x,y]=sp(w);pl_.querySelectorAll(`[data-tr="${idx}"]`).forEach(e=>{e.style.setProperty('--l2',x+'%');e.style.setProperty('--t2',y+'%');e.classList.add('sw');setTimeout(()=>e.remove(),600)})},1100)}}
function score(){const ov=$('#ov'),over=meta.st==='over';
  if(S.ph!=='score'&&!over){ov.className='ov';ov.dataset.k='';return}
  const key=S.k+(over?'o':'s');if(ov.dataset.k===key)return;ov.dataset.k=key;
  const rows=S.o.map((_,i)=>({i,p:N(S.p,i),d:N(S.d,i),ok:N(S.ok,i)}));
  if(over){const b=Math.min(...rows.map(r=>r.p));ov.innerHTML=`<div class="panel"><h2>Fin de partie</h2>${[...rows].sort((a,b)=>a.p-b.p).map((r,k)=>`<div class="rw" style="animation-delay:${k*.15}s"><span>${r.p===b?'🏆 ':''}${esc(nm(r.i))}</span><span>${chl(r.p)||'0'} ${r.p}</span></div>`).join('')}
    ${meta.host===user.uid?'<button class="pri hot" data-a="again">Rejouer</button>':'<p class="sub">L\'hôte peut relancer une partie.</p>'}<button data-a="quit">Quitter</button></div>`}
  else ov.innerHTML=`<div class="panel"><h2>Manche ${S.k} terminée</h2>${rows.map(r=>`<div class="rw" style="animation-delay:${r.i*.12}s"><span>${esc(nm(r.i))}<small class="sub"> · pari ${A(S.bt,r.i)}, gagné ${N(S.w,r.i)}</small></span><span class="d ${r.d>0?'bad':r.d<0?'ok':''}">${r.d>0?'+'+r.d+' '+chl(1):r.d<0?r.d+' '+chl(1):'✓'}</span></div>`).join('')}
    <div class="nx"><i></i></div>${act()[0]===user.uid?'<button data-a="skip">Manche suivante</button>':'<p class="sub" style="text-align:center">La prochaine manche arrive…</p>'}</div>`;
  ov.classList.add('on')}
/* ---- actions ---- */
function play(v){const i=me(),n=S.o.length;if(S.ph!=='play'||S.t!==i)return;
  const c=v===0?56:v,nh=hand.filter(x=>x!==c),u={['hands/'+user.uid]:nh.length?nh:null},tb={...S.tb,[i]:v};
  if(S.vh)u['state/vh/'+i]=nh.length?nh:null;
  if(Object.keys(tb).length<n){u['state/tb/'+i]=v;u['state/t']=S.m==='rev'?(i+n-1)%n:(i+1)%n}
  else{const w=win(S.m,tb,S.tr),tc=S.tc+1,end=tc===S.h;
    Object.assign(u,{'state/tb':null,'state/lt':{c:tb,w,n:S.k*100+tc},'state/tc':tc,'state/t':end?null:w,'state/ld':w,['state/w/'+w]:N(S.w,w)+1});
    if(end){const W=S.o.map((_,s)=>N(S.w,s)+(s===w?1:0)),ok=W.map((x,s)=>x===N(S.bt,s));let d=W.map((x,s)=>{const b=N(S.bt,s),r=ok[s];if(S.m==='ecart')return Math.min(3,Math.abs(x-b));if(S.m==='zero'&&b===0)return r?-1:2;return r?0:S.m==='dbl'?2:1});
      if(S.m==='har'&&ok.every(x=>x))d=d.map(()=>-1);if(S.m==='cur')d[w]+=1;const NP=S.o.map((_,s)=>Math.max(0,N(S.p,s)+d[s]));
      Object.assign(u,{'state/ph':'score','state/p':NP,'state/d':d,'state/ok':ok.map(x=>x?1:0)});if(NP.some(x=>x>=7))u['meta/st']='over'}}
  $('#jk').classList.remove('on');update(DB(),u)}
function rules(){$('#mb').innerHTML=`<h2>Règles</h2><ul><li>À chaque manche, chacun reçoit 3 à 6 cartes (1 à 55 + un Joker). Les cartes ont 5 couleurs (symbole + couleur du chiffre).</li><li>Tout le monde parie <b>en secret</b> sur le nombre de plis qu'il va gagner ; les paris sont révélés ensemble.</li><li>On joue une carte par pli, sans obligation de couleur : la plus forte gagne et ouvre le pli suivant.</li><li>Le Joker se joue « haut » (56) ou « bas » (0).</li><li>Pari raté = 1 piment. Quand quelqu'un atteint 7 piments, la partie s'arrête : le moins de piments gagne.</li><li>Chaque manche (sauf la 1re) a une <b>mission</b> tirée au hasard qui change une règle :</li></ul><ul style="margin-top:-6px">${Object.values(M).filter(x=>x!==M.plain).map(x=>`<li><b>${x[0]}</b> : ${x[1]}</li>`).join('')}</ul><button class="pri" data-a="close">Fermer</button>`;$('#md').classList.add('on')}
document.addEventListener('click',async e=>{
  const j=e.target.closest('[data-j]');if(j)return play(+j.dataset.j);
  const c=e.target.closest('#hd .c');if(c&&S&&S.ph==='play'&&S.t===me()){const v=+c.dataset.v;return v===56?$('#jk').classList.add('on'):play(v)}
  if(e.target.id==='md'){$('#md').classList.remove('on');return}
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='rules')rules();else if(a==='close')$('#md').classList.remove('on');
  else if(a==='th'){const d=document.documentElement.dataset,v=d.t==='dark'?'light':'dark';d.t=v;localStorage.setItem('fgt',v)}
  else if(a==='start')deal(1,null);
  else if(a==='skip')deal(S.k+1,S.o.map((_,i)=>N(S.p,i)));
  else if(a==='again')update(DB(),{state:null,hands:null,'meta/st':'lobby'});
  else if(a==='quit'){if(meta.st==='play'&&!confirm('Quitter met fin à la partie pour tout le monde. Continuer ?'))return;
    try{if(meta.st==='play')await update(DB(),{'meta/st':'over'});else if(meta.st==='lobby')await(meta.host===user.uid?set(DB(),null):set(DB('players/'+user.uid),null))}catch(x){}
    set(ref(db,'live/'+user.uid),null).catch(()=>{});location.href='index.html'}
});
